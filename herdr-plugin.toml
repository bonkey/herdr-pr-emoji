id = "bonkey.pr-emoji"
name = "PR Emoji"
version = "0.7.0"
min_herdr_version = "0.8.2"
description = "One emoji per sidebar row with the pull request state of the workspace's branch: ❔ no PR, 📝 draft, 🚂 queued to merge, 🪃 thrown out of the merge queue, ❌ required check failed, 🟠 failed with checks still running, 🟡 CI running, 👀 review required, 💬 conversation open, 🛑 blocked, ⚠️ conflict, 🆗 only optional checks failing, ✅ mergeable, 🟣 merged, 🚪 closed. A configured `signoffCommand` adds one more glyph for a review that happens outside GitHub: ➖ none wanted, 📭 missing, 🎫 open, 🏁 done. Two more actions sort the worktrees of every group by that state, or by name."
platforms = ["macos", "linux"]

# Render it in config.toml by adding { token = "$pr_emoji" } to a row of
# [ui.sidebar.agents] and/or [ui.sidebar.spaces].

# One long-lived loop, started with the server. No per-event hooks.
[[startup]]
command = ["python3", "daemon.py"]

# Manual refresh outside the polling interval:
#   herdr plugin action invoke bonkey.pr-emoji.refresh
[[actions]]
id = "refresh"
title = "Refresh PR emoji"
description = "Query GitHub now for every workspace's pull request state."
contexts = ["workspace"]
command = ["python3", "daemon.py", "--once"]

# Both sorts act on every worktree group, not only the workspace they are
# invoked from, and read the state the last poll recorded: no GitHub round
# trip. Bind them in config.toml:
#   [[keys.command]]
#   key = "prefix+alt+s"
#   type = "plugin_action"
#   command = "bonkey.pr-emoji.sort"
#   description = "sort worktrees by PR state"
[[actions]]
id = "sort"
title = "Sort worktrees by PR state"
description = "Order the worktrees of every group by pull request state, mergeable first and finished last, and by name inside a state."
contexts = ["workspace"]
command = ["python3", "daemon.py", "--sort"]

[[actions]]
id = "sort-name"
title = "Sort worktrees by name"
description = "Order the worktrees of every group by name."
contexts = ["workspace"]
command = ["python3", "daemon.py", "--sort-name"]
